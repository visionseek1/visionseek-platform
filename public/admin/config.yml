    description: "ترتيب الشريط العلوي: افتح «القائمة»، ثم اسحب القسم من المقبض ⠿ إلى مكانه، أو غيّر روابطه الفرعية. نفس الترتيب يظهر في التذييل. المسارات بلا بادئة اللغة (/ar تُضاف تلقائيًا). لا تضع رابطًا لصفحة غير موجودة."
