              - {label: مسار القسم, name: path, widget: string}
              - {label: الاسم English, name: en, widget: string}
              - {label: الاسم بالعربية, name: ar, widget: string}
              - label: الروابط الفرعية
                name: children
                widget: list
                summary: "{{fields.ar}} — {{fields.href}}"
                fields:
                  - {label: المسار (يبدأ بـ /), name: href, widget: string}
                  - {label: English, name: en, widget: string}
                  - {label: العربية, name: ar, widget: string}
