# مراقب الإشعارات: كل ربع ساعة يسأل الموقع «فيه جديد على د. أحمد؟»
# الموقع نفسه (/ops/push/send) هو اللي بيقرر: لو مفيش تغيير من آخر إشعار ما يبعتش حاجة.
# صفر توكنز — مجرد نداء HTTP. السر CRON_SECRET لازم يتضاف في GitHub:
# Settings → Secrets and variables → Actions → New repository secret (نفس قيمة Vercel).
name: push-watch
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: نداء مراقب الإشعارات
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then echo "CRON_SECRET غير مضاف في GitHub Secrets — متجاهل"; exit 0; fi
          code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://visionseek.org/ops/push/send)
          echo "HTTP $code"; cat /tmp/out; echo
          # 401/503 = إعدادات ناقصة، مش فشل في الشغل نفسه
          [ "$code" = "200" ] || [ "$code" = "503" ] || [ "$code" = "401" ]
