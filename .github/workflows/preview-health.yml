name: Preview health

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  checks: read
  contents: read
  pull-requests: read

jobs:
  verify-preview:
    name: Verify Vercel preview routes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Vercel preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in {1..36}; do
            preview_url="$(gh api "repos/$REPOSITORY/commits/$SHA/check-runs" --jq '.check_runs[] | select((.name | test("vercel"; "i")) and .conclusion == "success" and (.details_url != null)) | .details_url' | head -n1)"
            if [ -n "$preview_url" ]; then
              echo "url=$preview_url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "A successful Vercel preview check was not found." >&2
          exit 1
      - name: Verify core routes return 200
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          for route in / /ar /en /projects /insights /insights/physical-ai /ar/projects /ar/insights /ar/insights/physical-ai /room; do
            status="$(curl --fail --silent --show-error --location --max-time 20 --output /dev/null --write-out "%{http_code}" "$PREVIEW_URL$route")"
            [ "$status" = "200" ]
          done
