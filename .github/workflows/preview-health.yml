name: Preview health

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  checks: read
  contents: read
  pull-requests: read

jobs:
  verify-preview:
    name: Verify Vercel preview routes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Vercel preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in {1..36}; do
            vercel_state="$(gh api "repos/$REPOSITORY/commits/$SHA/status" --jq '.statuses[] | select(.context == "Vercel") | .state' | head -n1)"
            if [ "$vercel_state" = "failure" ] || [ "$vercel_state" = "error" ]; then
              echo "The Vercel deployment failed." >&2
              exit 1
            fi

            preview_url="$(gh api "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" --jq '.[] | select(.user.login == "vercel[bot]") | .body' \
              | sed -nE 's#.*\[Preview\]\((https://[^)]+\.vercel\.app)\).*#\1#p' \
              | tail -n1)"
            if [ "$vercel_state" = "success" ] && [ -n "$preview_url" ]; then
              echo "url=$preview_url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "A successful Vercel preview check was not found." >&2
          exit 1
      - name: Verify core routes return 200
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          probe() {
            local route="$1"
            local header=()
            if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
              header=(--header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
            fi
            curl --silent --show-error --location --max-time 20 --output /dev/null --write-out "%{http_code}" \
              "${header[@]}" \
              "$PREVIEW_URL$route"
          }
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not configured. Probes accept a protection redirect until that secret exists." >&2
          fi
          for route in / /ar /en /projects /insights /insights/physical-ai /ar/projects /ar/insights /ar/insights/physical-ai /privacy /terms /ar/privacy /ar/terms /favicon.ico /room; do
            status="$(probe "$route")"
            if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
              [ "$status" = "200" ]
            else
              case "$status" in
                200|302|307) ;;
                *) echo "$route returned $status" >&2; exit 1 ;;
              esac
            fi
          done
