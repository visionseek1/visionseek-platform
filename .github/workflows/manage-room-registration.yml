name: Room registration
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Validate registered modules and handovers
        run: npm run manage:check
      - name: Require handover for changed application code
        if: github.event_name == 'pull_request'
        env:
          MANAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run manage:handover
