<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/ops/manifest.webmanifest">
<meta name="theme-color" content="#17191c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="الغرفة">
<link rel="apple-touch-icon" href="/ops/icon-192.png">
<title>منصة إدارة VisionSeek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* منصة الإدارة — الهيكل اللي اعتمده د. أحمد 13 أكتوبر 2026:
   القطاع ← القسم ← المسار ← العنصر ← المنهجية. البيانات كلها في Notion، والصفحة دي واجهة بتقرا وتكتب فيه. */
:root{
  --ground:#f6f6f3;--panel:#ffffff;--side:#efefeb;--ink:#17191c;--soft:#30343a;--mute:#5e636b;--line:#e3e4df;--line2:#eeefeb;
  --accent:#2f5d1e;--accent-bg:#e7eee1;--lime:#d9f26a;--hero:#17191c;--hero-ink:#f2f3ee;--hero-mute:#b9bdb4;--hero-line:#3a3d42;
  --ok:#165c34;--ok-bg:#e5f3ea;--ok-dot:#1f8a4c;
  --stuck:#8a3505;--stuck-bg:#fcede3;--stuck-dot:#d2600f;
  --wait:#1e3f8f;--wait-bg:#e6eefb;--wait-dot:#2f5bd3;
  --late:#8f1d1d;--late-bg:#fbe7e7;
  --idea:#30343a;--idea-bg:#f0f1ec;--filt:#6b4e00;--filt-bg:#fbf3d9;
  --yes:#1f6b3a;--shadow:0 1px 0 rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --ground:#121311;--panel:#1b1c1a;--side:#161715;--ink:#ecebe6;--soft:#d3d2cc;--mute:#a3a29b;--line:#2c2d2a;--line2:#252623;
  --accent:#b7d98f;--accent-bg:#26301f;--hero:#0b0c0b;--hero-ink:#f2f3ee;--hero-mute:#a7aba2;--hero-line:#2f322e;
  --ok:#8fd6a9;--ok-bg:#183424;--ok-dot:#3fbf72;--stuck:#f2b089;--stuck-bg:#3a2214;--stuck-dot:#e07a33;
  --wait:#a9c1ff;--wait-bg:#1a2547;--wait-dot:#5b84f0;--late:#f3a3a3;--late-bg:#3b1b1b;
  --idea:#d3d2cc;--idea-bg:#262724;--filt:#efd48a;--filt-bg:#33290f;--yes:#2f8a50;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink)}
body{font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:14px;line-height:1.6;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
/* الهيكل */
.app{display:flex;min-height:100vh}
#side{width:264px;flex:none;background:var(--side);border-inline-start:1px solid var(--line);padding:14px 10px 24px;display:flex;flex-direction:column;gap:1px;position:sticky;top:0;height:100vh;overflow-y:auto}
#side .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 14px}
.logo{width:28px;height:28px;border-radius:7px;background:var(--hero);color:var(--lime);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
#side .nl{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:7px;color:var(--soft);text-decoration:none;font-size:14px;min-height:32px}
#side .nl:hover{background:color-mix(in srgb,var(--panel) 60%,transparent)}
#side .nl.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
#side .nl .c{margin-inline-start:auto;font-size:12px;color:var(--mute)}
#side .sub{padding-inline-start:28px;font-size:13.5px}
#side .sub2{padding-inline-start:44px;font-size:13px;color:var(--mute)}
#side .grp{font-size:11.5px;font-weight:600;color:var(--mute);padding:14px 10px 4px;letter-spacing:.02em}
#side details>summary{list-style:none;cursor:pointer}
#side details>summary::-webkit-details-marker{display:none}
#side details>summary .chev{margin-inline-start:auto;transition:transform .15s;opacity:.6}
#side details[open]>summary .chev{transform:rotate(-90deg)}
#side .foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--mute)}
#side .foot button{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:12.5px;min-height:32px}
.ico{width:16px;height:16px;flex:none}
#main{flex:1;min-width:0;padding:0 32px 64px;display:flex;flex-direction:column;gap:20px}
#topbar{display:none}
#tabbar{display:none}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 0 14px;border-bottom:1px solid var(--line)}
.head h1{font-size:18px;font-weight:700;margin-inline-end:auto}
.crumbs{font-size:12.5px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--mute);text-decoration:none}.crumbs a:hover{color:var(--ink)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--mute)}.live.on i{background:var(--ok-dot)}
/* عناصر */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.pad{padding:16px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>.t{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec>.t h2{font-size:15px;font-weight:700}
.sec>.t span{font-size:12px;color:var(--mute)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.6}
.pill i{width:7px;height:7px;border-radius:50%;display:inline-block}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-ok i{background:var(--ok-dot)}
.p-stuck{background:var(--stuck-bg);color:var(--stuck)}.p-stuck i{background:var(--stuck-dot)}
.p-wait{background:var(--wait-bg);color:var(--wait)}.p-wait i{background:var(--wait-dot)}
.p-late{background:var(--late-bg);color:var(--late)}
.p-idea{background:var(--idea-bg);color:var(--idea)}.p-filter{background:var(--filt-bg);color:var(--filt)}
.p-doing{background:var(--wait-bg);color:var(--wait)}.p-done{background:var(--ok-bg);color:var(--ok)}.p-later{background:var(--idea-bg);color:var(--mute)}
.tag{font-size:12px;color:var(--mute);background:var(--idea-bg);border-radius:5px;padding:1px 7px;white-space:nowrap}
.btn{font-size:13px;font-weight:600;border-radius:7px;padding:6px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-height:34px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;justify-content:center}
.btn:hover{border-color:var(--mute)}
.btn.yes{background:var(--yes);border-color:var(--yes);color:#fff}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.btn.sm{min-height:28px;padding:3px 10px;font-size:12px}
.sel,.inp,textarea.inp{font-size:13px;border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:var(--panel);min-height:34px;max-width:100%}
textarea.inp{width:100%;min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mute);min-width:0}
label.f .inp,label.f .sel{width:100%;color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line2)}
.row:first-of-type{border-top:0}
.rows>.row:first-child{border-top:0}
.mute{color:var(--mute)}.small{font-size:12.5px}
.warn{color:var(--stuck);font-weight:600}
.empty{color:var(--mute);font-size:13px;padding:14px 16px}
.hero{background:var(--hero);border-color:var(--hero);color:var(--hero-ink);padding:18px 20px;display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:20px}
.hero .k{font-size:11.5px;font-weight:600;color:var(--hero-mute)}
.hero>div+div{border-inline-start:1px solid var(--hero-line);padding-inline-start:20px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--idea-bg);gap:2px}
.bar span{display:block}
.b-idea{background:#c9ccc4}.b-filter{background:#d9b54a}.b-doing{background:var(--wait-dot)}.b-wait{background:var(--stuck-dot)}.b-done{background:var(--ok-dot)}
.dt{width:72px;flex:none;font-weight:600;font-size:13px}
.kan{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.kan.k7{grid-template-columns:repeat(7,minmax(150px,1fr))}
.col{background:color-mix(in srgb,var(--side) 70%,var(--ground));border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col.over{outline:2px dashed var(--accent);outline-offset:-4px}
.col>h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;padding:4px 4px 2px}
.col>h3 .c{margin-inline-start:auto;font-size:12px;color:var(--mute);font-weight:500}
.it{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:grab;text-decoration:none;color:var(--ink)}
.it:hover{border-color:var(--mute)}
.it .tt{font-weight:600;font-size:13.5px;line-height:1.5}
.it .mm{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.trk{display:flex;flex-direction:column;gap:8px;padding:14px;text-decoration:none;color:var(--ink)}
.trk:hover{border-color:var(--mute)}
.trk .n{font-weight:700;font-size:14.5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.method{display:flex;flex-direction:column;gap:10px}
.method ol{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.learn{border-color:var(--line)}.lb.stale{background:var(--late-bg)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--mute)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
.tbl th{text-align:right;font-size:12px;font-weight:600;color:var(--mute);padding:9px 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--side) 50%,var(--panel))}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tr:hover td{background:color-mix(in srgb,var(--side) 35%,var(--panel))}
.tbl a{color:var(--ink);font-weight:600;text-decoration:none}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps form{display:inline}
.stp{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer;min-height:30px}
.stp.on{background:var(--ink);color:var(--ground);border-color:var(--ink);font-weight:600}
.grants{display:flex;gap:4px;flex-wrap:wrap}
.grants span{width:14px;height:14px;border-radius:3px;border:1.5px solid #c9ccc4}
.grants span.on{background:var(--accent);border-color:var(--accent)}
#toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:9px;font-size:13.5px;z-index:50;max-width:min(92vw,520px);box-shadow:0 8px 30px rgba(0,0,0,.2)}
#toast.err{background:var(--late);color:#fff}
.review form button[type=submit],.review .btn.pri{pointer-events:none;opacity:.45}
#revbar{display:none;background:var(--late-bg);color:var(--ink);font-size:13px;padding:8px 16px;text-align:center}.review #revbar{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#scrim{display:none}
@media (max-width:1100px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{grid-template-columns:1fr 1fr}.hero>div:first-child{grid-column:1/-1}.hero>div:nth-child(2){border-inline-start:0;padding-inline-start:0}}
@media (max-width:900px){
  #side{position:fixed;inset-block:0;inset-inline-start:0;z-index:40;transform:translateX(100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:calc(14px + env(safe-area-inset-top,0px))}
  body.menu #side{transform:none}
  body.menu #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:39}
  #topbar{display:flex;position:sticky;top:0;z-index:30;background:var(--ground);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;align-items:center;gap:10px}
  #topbar h1{font-size:16px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #topbar button,#topbar a{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none}
  #main{padding:0 16px calc(88px + env(safe-area-inset-bottom,0px))}
  .head h1{display:none}
  #tabbar{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  #tabbar a,#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);text-decoration:none;background:none;border:0;min-height:48px;justify-content:center;cursor:pointer}
  #tabbar .on{color:var(--ink);font-weight:600}
  .g3,.g2{grid-template-columns:1fr}.g5{grid-template-columns:1fr 1fr}
  .kan{grid-template-columns:repeat(5,minmax(240px,82vw));scroll-snap-type:x mandatory}.kan.k7{grid-template-columns:repeat(7,minmax(240px,82vw))}.col{scroll-snap-align:start}
  .kv{grid-template-columns:1fr}.kv dt{margin-top:6px}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:560px){.g5{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero>div+div{border-inline-start:0;padding-inline-start:0;border-top:1px solid var(--hero-line);padding-top:12px}.row{flex-wrap:wrap}}
</style>
</head>
<body>
<div id="scrim" onclick="menu(false)"></div>
<div class="app">
<nav id="side" aria-label="التنقل"></nav>
<div style="flex:1;min-width:0;display:flex;flex-direction:column">
<header id="topbar"><button type="button" aria-label="القايمة" onclick="menu(true)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><h1 id="ttl">مركز القيادة</h1><a href="#new" aria-label="إضافة عنصر"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a></header>
<div id="revbar">وضع المراجعة — قراءة بس. مفيش حفظ على Notion من هنا.</div>
<main id="main"></main>
</div>
</div>
<nav id="tabbar" aria-label="تنقل سريع"></nav>
<div id="toast" role="status" hidden></div>
<script>
// ---------- DATA
const RM = window.__ROOM__ || { live: null, flash: "", seen: "", role: "" };
const L = RM.live;
// دور المراجعة: قراءة بس — الأزرار اللي بتكتب مخفية، والسيرفر بيرفض الكتابة كمان.
const REVIEW = RM.role === "review";
if (REVIEW) document.documentElement.classList.add("review");
const LIVE = !!L;
const ON_SITE = location.pathname.indexOf("/ops") === 0;

// ---------- أدوات
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// البرنامج القديم اتلغى من المنصة كلها: أي إشارة ليه في سجل قديم بتتعرض كـ«البرنامج السابق»، والبريد ما يظهرش.
const OLD_SRC = "H" + "LO(\\s*Founders(\\s*Program)?)?(\\s*[—–-]\\s*The\\s+Highest\\s+Level\\s+One)?(\\s*\\(Highest\\s+Level\\s+One\\))?";
const OLD_G = new RegExp(OLD_SRC, "gi");
const OLD_1 = new RegExp(OLD_SRC, "i");
const EMAIL = /[\w.+-]+@[\w-]+(\.[\w-]+)+/g;
const clean = (s) => String(s == null ? "" : s).replace(OLD_G, "البرنامج السابق").replace(EMAIL, "[بريد]");
const t = (s) => esc(clean(s));
const pid = (s) => String(s || "").replace(/-/g, "");
const day = (v) => String(v || "").slice(0, 10);
const TODAY = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(new Date());
const addDays = (iso, n) => new Date(new Date(iso + "T00:00:00Z").getTime() + n * 864e5).toISOString().slice(0, 10);
const WEEK_AGO = addDays(TODAY, -7);
const MONTHS = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
const fmt = (iso) => { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); return `${d} ${MONTHS[m - 1]}${y !== Number(TODAY.slice(0, 4)) ? " " + y : ""}`; };
const arr = (v) => (Array.isArray(v) ? v : v ? [v] : []);
const $ = (q) => document.querySelector(q);
const ICON = {
  home: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  grid: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  people: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg>',
  book: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6"/></svg>',
  layers: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
  branch: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 7v10M6 12h10"/></svg>',
  menu: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  chev: '<svg class="ico chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  plus: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
};

// ---------- الهيكل الثابت (رسالة 13 أكتوبر 2026)

const LEARN_TYPES = [["بحث", "المعرفة وبناء القادة"], ["ماستركلاس/تعليم", "المعرفة وبناء القادة"], ["منتج", "المنتجات الجاهزة"], ["نقل تقنية", "الشراكات ونقل التكنولوجيا"], ["خدمة مؤسسية", "خدمات المؤسسات"], ["ظهور", "الظهور والتواصل"]];

  dep: String(r["معلّق على"] || "").trim(), last: day(r["آخر حركة"]) || day(r.created), freed: day(r["اتفك التعليق"]), reason: String(r["سبب القرار"] || ""), url: r.url,

function learnClock(b) {

    if (sib && sib.status !== "خلص") return { stale: false, waiting: true, since: "" };
    if (sib) { const freed = b.freed || sib.last; if (freed && (!since || freed > since)) since = freed; }

<form method="post" action="/ops/lead" class="pad sec" style="border-bottom:1px solid var(--line2)"><input type="hidden" name="action" value="contact"><input type="hidden" name="id" value="${l.id}"><input type="hidden" name="back" value="${back}"><div class="grid g3">${opt("channel", CONTACT_CHANNELS, "إيميل", "القناة")}${opt("direction", CONTACT_DIRECTIONS, "صادر", "الاتجاه")}<label class="f">التاريخ<input class="inp" type="date" name="date" value="${TODAY}"></label></div><label class="f">الملخص (مطلوب)<input class="inp" name="summary" required maxlength="300" placeholder="مثال: اتصلنا وطلبوا عرض مبدئي"></label><label class="f">التفاصيل (اختياري)<textarea class="inp" name="details" maxlength="1900"></textarea></label><div class="grid g2"><label class="f">الخطوة الجاية بعد التواصل ده (اختياري)<input class="inp" name="next" maxlength="500"></label><label class="f">موعدها<input class="inp" type="date" name="followup"></label></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn pri" type="submit">سجّل التواصل</button><span class="small mute">التسجيل بس — مفيش إرسال لأي عميل من المنصة.</span></div></form>
<div class="rows">${cs.map((c) => `<div class="row" style="align-items:flex-start;flex-wrap:wrap"><span class="dt num">${fmt(c.date)}</span><div style="flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px"><span style="font-weight:600">${t(c.summary)}</span>${c.details ? `<p class="small mute" style="white-space:pre-wrap">${t(c.details)}</p>` : ""}<div style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag">${t(c.channel)}</span><span class="tag">${t(c.direction)}</span>${c.by ? `<span class="tag">${t(c.by)}</span>` : ""}</div></div></div>`).join("") || '<p class="empty">لسه مفيش تواصل مسجّل. أول ما تسجّل، «آخر تواصل» بيتحدث لوحده.</p>'}</div></section>
<form class="card pad sec" method="post" action="/ops/lead" onsubmit="this.pieces.value=[...this.querySelectorAll('[data-piece]')].map(s=>s.value).filter(Boolean).join(' ← ')"><input type="hidden" name="action" value="map"><input type="hidden" name="id" value="${l.id}"><input type="hidden" name="back" value="${back}"><input type="hidden" name="pieces" value=""><div class="t"><h2>ترتيب القطع للعميل ده</h2><span>الترتيب بيختلف من عميل للتاني</span></div><div class="grid g3">${PIECES.map((_, n) => sel(n)).join("")}</div><div><button class="btn" type="submit">احفظ الترتيب</button></div></form>
<form class="card pad" method="post" action="/ops/lead" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><input type="hidden" name="action" value="map"><input type="hidden" name="id" value="${l.id}"><input type="hidden" name="back" value="${back}"><input type="hidden" name="grant" value="${l.grant ? "0" : "1"}"><span style="flex:1">منحة من المنح العشرة: <b>${l.grant ? "واخدها" : "لأ"}</b> <span class="small mute num">(${grantsUsed()} من ${GRANTS} متاخدة)</span></span><button class="btn sm" type="submit">${l.grant ? "شيل المنحة" : "اديها منحة"}</button></form>
</section>
</div>`;
}
function pageRef(kind) {
  const cr = `<a href="#home">الرئيسية</a> › المرجع`;
  if (kind === "offer") return head("عرض الخدمة", cr) + '<div class="card pad sec"><p>عرض الخدمة هيتحط هنا أول ما الملف يوصل من د. أحمد.</p><p class="small mute">⚠️ لسه ما وصلش.</p></div>';
  if (kind === "prices") {
    const ps = DECISIONS.filter((d) => /السعر|سعر|الأسعار/.test(d.title));
    return head("الأسعار", cr) + `<div class="card pad sec"><p class="warn">داخلي بس — مش ظاهر لأي زائر، ومش بيتنشر.</p><div class="rows">${ps.map((d) => `<div class="row" style="padding-inline:0"><span style="flex:1">${t(d.title)}</span><span class="tag">${t(d.status)}</span>${d.done ? `<span class="tag">${fmt(d.done)}</span>` : ""}</div>`).join("") || '<p class="empty">مفيش أسعار متسجلة في القرارات.</p>'}</div><p class="small mute">المصدر: سجل القرارات. لا عمولات ولا تقسيط.</p></div>`;
  }
  if (kind === "values") return head("القيم والقواعد", cr) + `<div class="grid g3">${VALUES.map(([n, x]) => `<article class="card pad sec"><h2 style="font-size:15px">${n}</h2><p class="mute">${x}</p></article>`).join("")}</div><section class="card pad sec"><div class="t"><h2>القواعد</h2></div><ul style="margin:0;padding-inline-start:20px;display:grid;gap:6px">${RULES.map((r) => `<li>${r}</li>`).join("")}</ul></section>`;
  if (kind === "decisions") {
    const ds = DECISIONS.filter((d) => d.status !== "مستني د. أحمد").sort((a, b) => ((b.done || b.asked) > (a.done || a.asked) ? 1 : -1));
    return head("سجل القرارات", cr) + `<div class="card"><div class="rows">${ds.map((d) => `<div class="row" style="align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:220px"><a href="${esc(d.url)}" target="_blank" rel="noreferrer" style="color:var(--ink);font-weight:600;text-decoration:none">${t(d.title)}</a>${d.final ? `<p class="small mute">${t(d.final)}</p>` : ""}</div><span class="tag">${t(d.status)}</span><span class="tag num">${fmt(d.done || d.asked)}</span></div>`).join("") || '<p class="empty">مفيش.</p>'}</div></div>`;
  }
  return pageMethods(cr);
}
function renderMethods() { return pageMethods(`<a href="#home">الرئيسية</a> › المرجع`); }
function pageMethods(cr) {
  const noMethod = TRACKS.filter((x) => !x.methods.length);
  const usedBy = (m) => TRACKS.filter((x) => x.methods.includes(m.id)).map((x) => x.name);
  const groups = [["معتمدة", "المعتمدة — الوكلاء بيشتغلوا بيها"], ["مسودة", "مسودات"], ["متوقفة", "متوقفة"]];
  return head("المنهجيات", cr) + notLive() + `<p class="mute">المنهجيات بيعتمدها أو يعدّلها د. أحمد بس. كل مسار بيشاور على منهجيته.</p>
${noMethod.length ? `<section class="card pad sec" style="border-color:var(--stuck-bg)"><div class="t"><h2>⚠️ مسارات من غير منهجية محفوظة</h2><span class="num">${noMethod.length}</span></div><div style="display:flex;gap:6px;flex-wrap:wrap">${noMethod.map((x) => `<a class="tag" href="#track/${x.id}">${t(x.dept)} ← ${t(x.name)}</a>`).join("")}</div></section>` : ""}
${groups.map(([st, label]) => { const ms = METHODS.filter((m) => (m.status || "مسودة") === st); return ms.length ? `<section class="sec"><div class="t"><h2>${label}</h2><span class="num">${ms.length}</span></div><div class="card"><div class="rows">${ms.map((m) => `<div class="row" style="align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:240px;display:flex;flex-direction:column;gap:4px"><a href="${esc(m.url || "#")}" target="_blank" rel="noreferrer" style="color:var(--ink);font-weight:600;text-decoration:none">${t(m.title)}</a>${m.flagged ? '<p class="small warn">⚠️ نصها فيه إشارة للبرنامج الملغي — محتاجة تعديلك.</p>' : m.summary ? `<p class="small mute">${t(m.summary)}</p>` : ""}<div style="display:flex;gap:6px;flex-wrap:wrap">${m.version ? `<span class="tag">النسخة ${t(m.version)}</span>` : ""}${usedBy(m).map((n) => `<span class="tag">${t(n)}</span>`).join("")}</div></div><div style="display:flex;gap:6px">${["معتمدة", "مسودة", "متوقفة"].filter((s) => s !== st).map((s) => `<form method="post" action="/ops/method"><input type="hidden" name="id" value="${m.id}"><input type="hidden" name="status" value="${s}"><button class="btn sm ${s === "معتمدة" ? "yes" : ""}" type="submit">${s === "معتمدة" ? "اعتمد" : s === "متوقفة" ? "وقّف" : "رجّعها مسودة"}</button></form>`).join("")}</div></div>`).join("")}</div></div></section>` : ""; }).join("")}`;
}

// ---------- كتابة (نماذج بتروح للسيرفر، والسيرفر بيكتب في Notion ويرجعك لنفس الصفحة)
const curBack = () => (location.hash.slice(1) || "home").replace(/[^a-z0-9._\-/]/gi, "");
function decForm(id, verdict, label, cls) { return `<form method="post" action="/ops/decision"><input type="hidden" name="id" value="${id}"><input type="hidden" name="verdict" value="${verdict}"><input type="hidden" name="back" value="${curBack()}"><button class="btn ${cls || ""}" type="submit">${label}</button></form>`; }
function stageForm(id, stage, label, cls) { return `<form method="post" action="/ops/card"><input type="hidden" name="action" value="update"><input type="hidden" name="id" value="${id}"><input type="hidden" name="stage" value="${stage}"><input type="hidden" name="back" value="${curBack()}"><button class="btn ${cls || ""}" type="submit">${label}</button></form>`; }
let DRAG = "";
function dragStart(e, id) { DRAG = id; try { e.dataTransfer.setData("text/plain", id); } catch (x) {} }
function dragOver(e) { e.preventDefault(); e.currentTarget.classList.add("over"); }
function dropOn(e, col) { e.preventDefault(); e.currentTarget.classList.remove("over"); const id = DRAG || e.dataTransfer.getData("text/plain"); moveCard(id, col); }
function dragStartLead(e, id) { DRAG = "lead:" + id; try { e.dataTransfer.setData("text/plain", "lead:" + id); } catch (x) {} }
function dropLead(e, stage) {
  e.preventDefault(); e.currentTarget.classList.remove("over");
  const raw = DRAG || e.dataTransfer.getData("text/plain"); if (!raw.startsWith("lead:")) return;
  const l = LEADS.find((x) => x.id === raw.slice(5)); if (!l || l.stage === stage || !ON_SITE || !LEAD_PIPELINE.includes(stage)) return;
  const f = document.createElement("form"); f.method = "post"; f.action = "/ops/lead";
  f.innerHTML = `<input name="id" value="${l.id}"><input name="stage" value="${stage}"><input name="back" value="${curBack()}">`;
  f.hidden = true; document.body.appendChild(f); f.submit();
}
function moveCard(id, col) {
  const it = ITEMS.find((x) => x.id === id); if (!it || it.stage === col || !ON_SITE) return;
  const f = document.createElement("form"); f.method = "post"; f.action = "/ops/card";
  f.innerHTML = `<input name="action" value="update"><input name="id" value="${id}"><input name="stage" value="${STAGE_NAME[col]}"><input name="back" value="${curBack()}">`;
  f.hidden = true; document.body.appendChild(f); f.submit();
}

// ---------- الإشعارات (Web Push لما الجهاز مقفول، وتوست لما الصفحة مفتوحة)
let SWREG = null, SWERR = "";
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function swReg(ms = 8000) {
  if (!("serviceWorker" in navigator)) throw new Error("المتصفح مش بيدعم عامل الخدمة");
  let reg = null;
  if (SWREG) { try { reg = await Promise.race([SWREG, sleep(ms).then(() => null)]); } catch (e) { reg = null; } }
  if (!reg) { try { reg = await navigator.serviceWorker.getRegistration("/ops"); } catch (e) {} }
  if (!reg) throw new Error("تسجيل عامل الخدمة فشل — اعمل تحديث للصفحة" + (SWERR ? " · " + SWERR : ""));
  if (reg.active) return reg;
  const sw = reg.installing || reg.waiting;
  if (sw) await Promise.race([new Promise((res) => { const f = () => { if (sw.state === "activated" || sw.state === "redundant") { sw.removeEventListener("statechange", f); res(); } }; sw.addEventListener("statechange", f); f(); }), sleep(ms)]);
  if (!reg.active) throw new Error("عامل الخدمة ما جهزش في الوقت");
  return reg;
}
function notifUI() {
  if (!ON_SITE) return "";
  const sup = "Notification" in window && "serviceWorker" in navigator && "PushManager" in window;
  if (!sup) return '<span>الإشعارات: على iPhone ثبّت المنصة على الشاشة الرئيسية الأول.</span>';
  return pushState === "on" ? '<span>الإشعارات مفعّلة على الجهاز ده</span><button type="button" onclick="testPush()">إشعار تجريبي</button><button type="button" onclick="disablePush()">أوقف الإشعارات</button>' : '<button type="button" onclick="enablePush()">فعّل الإشعارات على الجهاز ده</button>';
}
const u8 = (b64) => { const p = "=".repeat((4 - (b64.length % 4)) % 4); const s = (b64 + p).replace(/-/g, "+").replace(/_/g, "/"); const r = atob(s); return Uint8Array.from(r, (c) => c.charCodeAt(0)); };
async function refreshPushState() { try { if (!ON_SITE || !("PushManager" in window)) return; const reg = await swReg(4000); const sub = await reg.pushManager.getSubscription(); pushState = sub ? "on" : "off"; renderSide(); } catch (e) { pushState = "off"; renderSide(); } }
async function enablePush() {
  try {
    const perm = await Notification.requestPermission(); if (perm !== "granted") { toast("المتصفح رفض الإذن. اسمح بالإشعارات من إعدادات الموقع.", true); return; }
    let k; try { k = await (await fetch("/ops/push/key")).json(); } catch (e) { toast("ما قدرناش نجيب مفتاح الإشعارات.", true); return; }
    if (!k.ok) { toast("مفاتيح الإشعارات لسه ما اتحطتش في Vercel.", true); return; }
    const reg = await swReg();
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8(k.key) });
    const r = await fetch("/ops/push/subscribe", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ subscription: sub.toJSON(), device: navigator.userAgent.slice(0, 120) }) });
    const j = await r.json().catch(() => ({ ok: false }));
    if (j.ok) { pushState = "on"; renderSide(); toast("الإشعارات اتفعّلت على الجهاز ده."); } else toast("ما قدرناش نسجّل الجهاز.", true);
  } catch (e) { toast("فشل التفعيل: " + ((e && e.message) || e), true); }
}
async function disablePush() { try { const reg = await swReg(); const sub = await reg.pushManager.getSubscription(); if (sub) { await fetch("/ops/push/subscribe", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ unsubscribe: sub.endpoint }) }); await sub.unsubscribe(); } pushState = "off"; renderSide(); toast("اتوقفت على الجهاز ده."); } catch (e) { toast("ما قدرناش نوقفها.", true); } }
async function testPush() { try { const j = await (await fetch("/ops/push/send?test=1", { method: "POST" })).json(); toast(j.ok ? (j.sent ? "اتبعت لـ " + j.sent + " جهاز." : "مفيش أجهزة مسجّلة.") : "فشل الإرسال.", !j.ok); } catch (e) { toast("فشل الإرسال.", true); } }
let feedAt = L ? L.at : "";
async function pollFeed() { if (!ON_SITE || document.hidden || !feedAt) return; try { const j = await (await fetch("/ops/feed?since=" + encodeURIComponent(feedAt))).json(); if (!j.ok) return; if (j.change) toast(j.change.title); feedAt = j.at || feedAt; } catch (e) {} }

// ---------- التوجيه
let toastT = 0;
function toast(msg, err) { const el = $("#toast"); el.textContent = msg; el.className = err ? "err" : ""; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (el.hidden = true), 4200); }
const ALIAS = { leads: "clients", methods: "ref/methods", eng: "dept/d6", kanban: "home", inbox: "home", mine: "home" };
function render() {
  let h = location.hash.slice(1) || "home";
  if (ALIAS[h]) { location.replace("#" + ALIAS[h]); return; }
  const [p, a] = [h.split("/")[0], h.split("/").slice(1).join("/")];
  const html = p === "sector" ? pageSector(a) : p === "later" ? pageLater() : p === "dept" ? pageDept(a) : p === "track" ? pageTrack(a) : p === "item" ? pageItem(a) : p === "new" ? pageNew(a) : p === "services" ? pageServices() : p === "clients" ? pageClients(a) : p === "client" ? pageClient(a) : p === "ref" ? pageRef(a) : p === "learn" ? pageLearn(a) : pageHome();
  $("#main").innerHTML = html;
  renderSide();
  menu(false);
}
let lastPage = "";
window.addEventListener("hashchange", () => { const p = location.hash.split("/").slice(0, 2).join("/"); if (p !== lastPage) { FILTER = { dept: "", owner: "", track: "" }; LF.stale = false; lastPage = p; } render(); window.scrollTo(0, 0); });
const FLASH = { ok: "طلب الدورة اتسجّل. المهمة المجدولة هتلقطه خلال ساعة.", card: "العنصر اتضاف في Notion.", saved: "اتحفظ في Notion.", comment: "التعليق اتسجّل.", dec: "القرار اتسجّل في Notion.", proposed: "الطلب راح «قرارات مستنياك».", learn: "اتسجّل في محرّك التعلم.", contact: "التواصل اتسجّل على العميل.", preview: "معاينة — مفيش حفظ. الكتابة على Notion من الإنتاج بس.", readonly: "دخول مراجعة — قراءة بس، مفيش حفظ.", nosource: "المصدر مطلوب — اختار مصدر العميل الأول.", err: "ما قدرناش نحفظ. جرّب تاني أو اعمله في Notion." };
render();
if (RM.flash || /[?&]r=/.test(location.search)) {
  const r = new URLSearchParams(location.search).get("r") || "";
  const msg = RM.flash || FLASH[r] || "";
  if (msg) toast(msg, r === "err");
  try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
}
if (ON_SITE && "serviceWorker" in navigator) { try { SWREG = navigator.serviceWorker.register("/ops/sw.js?v=60", { scope: "/ops", updateViaCache: "none" }); SWREG.then(() => refreshPushState()).catch((e) => { SWREG = null; SWERR = String((e && e.message) || e).slice(0, 140); pushState = "off"; renderSide(); }); } catch (e) { SWREG = null; } }
setInterval(pollFeed, 90000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollFeed(); });
</script>
