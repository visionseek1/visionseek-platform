<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>سجل نقل القدرة — غلاف</title>
<style>
@font-face{font-family:"Plex Arabic";src:url(../doctrine/fonts/IBMPlexSansArabic-Regular.ttf);font-weight:400}
@font-face{font-family:"Plex Arabic";src:url(../doctrine/fonts/IBMPlexSansArabic-Medium.ttf);font-weight:500}
@font-face{font-family:"Plex Arabic";src:url(../doctrine/fonts/IBMPlexSansArabic-Bold.ttf);font-weight:700}
@font-face{font-family:"Kufi";src:url(../doctrine/fonts/NotoKufiArabic-VariableFont_wght.ttf);font-weight:100 900}
@font-face{font-family:"Grotesk";src:url(../doctrine/fonts/SpaceGrotesk-VariableFont_wght.ttf);font-weight:300 700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1200px;overflow:hidden;background:#0d0d0d}
.frame{width:1600px;height:1200px;position:relative;background:#0d0d0d;color:#fff}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:48px 48px}
.bar{position:absolute;top:0;bottom:0;right:0;width:28px;background:#ccff00}
.brand{position:absolute;top:64px;right:72px;display:flex;align-items:center;gap:14px;direction:ltr}
.brand img{height:56px;width:auto}
.brand span{font-family:"Grotesk",sans-serif;font-weight:700;font-size:28px;letter-spacing:.04em}
.kicker{position:absolute;top:280px;right:72px;font-family:"Grotesk",sans-serif;font-weight:700;letter-spacing:.28em;font-size:18px;color:#ccff00;direction:ltr}
h1{position:absolute;top:330px;right:72px;left:80px;font-family:"Kufi","Plex Arabic",sans-serif;font-weight:800;font-size:92px;line-height:1.25}
.sub{position:absolute;top:520px;right:72px;left:200px;font-family:"Plex Arabic",sans-serif;font-size:32px;line-height:1.7;color:#e4e6de}
.badge{position:absolute;top:820px;right:72px;border:1.5px solid #b0f51e;color:#b0f51e;font-family:"Plex Arabic",sans-serif;font-size:20px;padding:10px 22px}
.steps{position:absolute;left:80px;bottom:88px;display:flex;align-items:flex-end;gap:10px;direction:ltr}
.steps i{display:block;width:36px;border:1.5px solid rgba(204,255,0,.55);border-bottom:none}
.steps i:last-child{background:#ccff00;border-color:#ccff00}
.foot{position:absolute;bottom:64px;right:72px;font-family:"Plex Arabic",sans-serif;font-size:20px;color:#a9aba4;line-height:1.7}
.foot b{color:#fff;font-weight:600}
</style>
</head>
<body>
<div class="frame">
  <div class="grid"></div>
  <div class="bar"></div>
  <div class="brand"><img src="assets/visionseek-chevron.png" alt=""><span>VISIONSEEK</span></div>
  <p class="kicker">VISIONSEEK LAB · CAPABILITY LEDGER</p>
  <h1>سجل نقل القدرة</h1>
  <p class="sub">ماذا يبقى في الخليج بعد صفقات الذكاء الاصطناعي ومراكز البيانات؟<br>تركيب منهجي للأدلة المنشورة · السعودية والإمارات</p>
  <p class="badge">مختبر VisionSeek · رؤى · الإصدار 1</p>
  <div class="steps" aria-hidden="true"><i style="height:28px"></i><i style="height:48px"></i><i style="height:68px"></i><i style="height:90px"></i><i style="height:114px"></i></div>
  <p class="foot"><b>أكتوبر 2026</b><br>إعداد: أحمد عبدالعليم</p>
</div>
</body>
</html>
